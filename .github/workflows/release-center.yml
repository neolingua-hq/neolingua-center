name: Release Neolingua Center

on:
  push:
    tags:
      # SemVer without "v" prefix (1.0.0, 1.0.0-beta.1). Not v1.0.0.
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-center:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            triple: aarch64-apple-darwin
            artifact: macos-aarch64
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            triple: x86_64-apple-darwin
            artifact: macos-x86_64
          - platform: windows-latest
            args: --bundles nsis
            triple: x86_64-pc-windows-msvc
            artifact: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      # beforeBuildCommand only fetches the host triple; cross builds (Intel on
      # arm64 runners) need the target sidecars explicitly.
      - name: Fetch sidecars for target triple
        run: |
          node scripts/fetch-ffmpeg-binaries.mjs ${{ matrix.triple }}
          node scripts/fetch-whisper-binaries.mjs ${{ matrix.triple }}

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          rm -f certificate.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Prepare App Store Connect API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('{0}', github.run_number) }}
          releaseName: Neolingua Center ${{ github.ref_type == 'tag' && github.ref_name || format('{0}', github.run_number) }}
          releaseBody: |
            Installers and automatic updates for Neolingua Center.
            First install: https://download.neolingua.app
            The app checks `latest.json` on this release for updates.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Upload macOS DMG for R2
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.artifact }}
          path: src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Windows NSIS for Authenticode
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Authenticode (Certum SimplySign) must run in an interactive Windows session
  # where SimplySign Desktop is logged in. The self-hosted runner on titane
  # must be started via run.cmd in that session (not as a Windows service).
  # Wake the machine before tagging: wake-titane
  sign-windows:
    needs: publish-center
    if: ${{ always() && !cancelled() && github.repository == 'neolingua-hq/neolingua-center' }}
    runs-on: [self-hosted, Windows, X64, signing]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download unsigned Windows NSIS
        id: dl
        uses: actions/download-artifact@v8
        with:
          name: installer-windows-x64
          path: unsigned
        continue-on-error: true

      - name: Authenticode sign
        if: steps.dl.outcome == 'success'
        shell: pwsh
        env:
          CERTUM_CERT_SHA1: 1D3E06AABF499CAA5C3F3FF0D4263B26698F7C7D
          CERTUM_TIMESTAMP: http://time.certum.pl
        run: |
          $exe = Get-ChildItem -Path unsigned -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'No Windows NSIS .exe in artifact' }
          Write-Host "Signing $($exe.FullName)"
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sign-windows-authenticode.ps1 -File $exe.FullName
          New-Item -ItemType Directory -Force -Path signed | Out-Null
          Copy-Item $exe.FullName "signed/$($exe.Name)"

      - name: Upload signed Windows NSIS
        if: steps.dl.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: installer-windows-x64-signed
          path: signed/*.exe
          if-no-files-found: error

      - name: Replace release asset with signed exe
        if: steps.dl.outcome == 'success' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem signed -Filter *.exe | Select-Object -First 1
          gh release upload "${{ github.ref_name }}" $exe.FullName --clobber --repo "${{ github.repository }}"

  # Authenticode changes bytes: regenerate the Tauri updater .sig and patch latest.json.
  resign-windows-updater:
    needs: sign-windows
    if: ${{ always() && !cancelled() && needs.sign-windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download signed Windows NSIS
        id: dl
        uses: actions/download-artifact@v8
        with:
          name: installer-windows-x64-signed
          path: signed
        continue-on-error: true

      - name: Regenerate updater .sig
        id: sig
        if: steps.dl.outcome == 'success'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x scripts/resign-windows-updater.sh
          exe="$(find signed -type f -name '*.exe' | head -n 1)"
          [[ -n "$exe" ]] || { echo "No signed exe"; exit 1; }
          ./scripts/resign-windows-updater.sh "$exe"
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
          echo "sig=${exe}.sig" >> "$GITHUB_OUTPUT"

      - name: Upload .sig to GitHub Release
        if: steps.sig.outcome == 'success' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" "${{ steps.sig.outputs.sig }}" \
            --clobber --repo "${{ github.repository }}"

      - name: Patch latest.json Windows signature
        if: steps.sig.outcome == 'success' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "${{ github.ref_name }}" -p latest.json -O latest.json \
            --repo "${{ github.repository }}"
          SIG="$(tr -d '\n\r' < "${{ steps.sig.outputs.sig }}")"
          export SIG
          python3 - <<'PY'
          import json, os
          sig = os.environ["SIG"]
          with open("latest.json", encoding="utf-8") as f:
              data = json.load(f)
          platforms = data.get("platforms") or {}
          # Tauri platform keys for Windows NSIS
          keys = [k for k in platforms if "windows" in k.lower()]
          if not keys:
              raise SystemExit(f"no windows platform in latest.json: {list(platforms)}")
          for k in keys:
              platforms[k]["signature"] = sig
              print(f"patched {k}")
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          gh release upload "${{ github.ref_name }}" latest.json \
            --clobber --repo "${{ github.repository }}"

  publish-r2:
    needs: [publish-center, sign-windows]
    # Publish whatever installers succeeded (do not block on one matrix leg).
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download macOS installers
        uses: actions/download-artifact@v8
        with:
          pattern: installer-macos-*
          path: artifacts/macos
          merge-multiple: true
          # Some matrix legs may have failed (no artifact for that OS).
        continue-on-error: true

      # Signed and unsigned NSIS share the same file name: never merge them.
      # Only the Authenticode-signed artifact may reach R2.
      - name: Download Authenticode-signed Windows NSIS
        if: ${{ needs.sign-windows.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: installer-windows-x64-signed
          path: artifacts/windows-signed

      - name: Pick macOS aarch64 DMG and signed Windows NSIS
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -type f | sort
          dmg="$(find artifacts/macos -type f -name '*.dmg' 2>/dev/null | grep -E 'aarch64|arm64' | head -n 1 || true)"
          if [[ -z "$dmg" ]]; then
            dmg="$(find artifacts/macos -type f -name '*.dmg' 2>/dev/null | head -n 1 || true)"
          fi
          exe="$(find artifacts/windows-signed -type f -name '*.exe' 2>/dev/null | head -n 1 || true)"
          if [[ -z "$exe" ]]; then
            echo "::warning::No Authenticode-signed Windows installer (sign-windows: ${{ needs.sign-windows.result }}). Windows R2 object left unchanged."
          fi
          echo "dmg=${dmg}" >> "$GITHUB_OUTPUT"
          echo "exe=${exe}" >> "$GITHUB_OUTPUT"
          [[ -n "$dmg" ]] || { echo "No DMG found"; exit 1; }

      - name: Publish Whisper model to R2 if missing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/publish-whisper-model.mjs

      - name: Upload installers to R2 (S3 multipart)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"
          export AWS_DEFAULT_REGION=auto
          export AWS_EC2_METADATA_DISABLED=true
          aws s3 cp "${{ steps.pick.outputs.dmg }}" \
            "s3://neolingua-downloads/macos/neolingua-latest.dmg" \
            --endpoint-url "${ENDPOINT}" \
            --content-type application/x-apple-diskimage
          if [[ -n "${{ steps.pick.outputs.exe }}" ]]; then
            aws s3 cp "${{ steps.pick.outputs.exe }}" \
              "s3://neolingua-downloads/windows/neolingua-latest.exe" \
              --endpoint-url "${ENDPOINT}" \
              --content-type application/octet-stream
          fi
