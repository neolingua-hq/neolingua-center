[package]
name = "neolingua-center"
version = "1.0.0-beta.1"
description = "Neolingua Center - family host"
authors = ["Neolingua"]
edition = "2021"

[lib]
name = "neolingua_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
if-addrs = "0.15"
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "fs", "io-util", "time"] }
# Stay on 0.6: axum 0.8 is not on tower-http 0.7 yet.
tower-http = { version = "0.6", features = ["cors", "fs"], default-features = false }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tauri-plugin-clipboard-manager = "2"
tokio-util = { version = "0.7.19", features = ["io"] }
tauri-plugin-process = "2.3.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.11.0"
